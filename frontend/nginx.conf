# nginx del frontend en producción: sirve el SPA y hace de proxy al backend.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: permite re-resolver "backend" si el contenedor reinicia
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 12m;   # importa/base64 de equipos (backend usa limit 10mb)

    # --- API -> backend ---
    location /api/ {
        set $backend http://backend:5080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Archivos públicos del backend (logos para emails, etc.) ---
    location /public/ {
        set $backend http://backend:5080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # --- Assets con hash: caché larga ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA: cualquier otra ruta la resuelve React Router ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
